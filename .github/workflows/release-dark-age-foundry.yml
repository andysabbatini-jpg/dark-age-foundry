name: Release Dark Age Foundry system
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package system
        run: |
          mkdir -p dist/dark-age-foundry
          cp -a Black_Powder_and_Brimstone_0.8.4/bpnb-borg/. dist/dark-age-foundry/
          cd dist
          zip -r ../dark-age-foundry.zip dark-age-foundry
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dark-age-foundry.zip --title "Dark Age Foundry ${GITHUB_REF_NAME}" --notes "Dark Age fork release; upstream credits preserved."
